<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>radio renderghost</title>
<meta name="description" content="My personal favourite radio stations — ambient, dub, and underground radio streamed live from Berlin, Bristol, Rotterdam, and beyond.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://radio.renderg.host/">
<meta property="og:title" content="radio renderghost">
<meta property="og:description" content="My personal favourite radio stations — ambient, dub, and underground radio streamed live from Berlin, Bristol, Rotterdam, and beyond.">
<meta property="og:image" content="https://radio.renderg.host/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="radio renderghost — an on-air indicator over a speaker grille">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="radio renderghost">
<meta name="twitter:description" content="My personal favourite radio stations — ambient, dub, and underground radio streamed live from Berlin, Bristol, Rotterdam, and beyond.">
<meta name="twitter:image" content="https://radio.renderg.host/og.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="radio" id="radio">

  <!-- Speaker grille dot grid: 16 columns x 6 rows, 6px gap between dots.
       To change: edit COLS/ROWS/GAP below, keep viewBox = COLS*CELL x ROWS*CELL,
       and circle r = (CELL-GAP)/2 so the dot fills the cell. -->
  <svg class="speaker" aria-hidden="true" viewBox="0 0 480 180">
    <defs>
      <!-- COLS=16 ROWS=6 GAP=6 CELL=30 -->
      <pattern id="speaker-grille" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle class="speaker__dot" cx="15" cy="15" r="6"></circle>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#speaker-grille)"></rect>
  </svg>

  <section class="display">
    <div class="display__status-row">
      <div class="display__status-group">
        <span class="display__status" id="status-dot" aria-hidden="true"></span>
        <span class="display__status-label" id="status-label">Off Air</span>
      </div>
      <span class="display__counter" id="station-counter"></span>
    </div>
    <div class="display__text">
      <div class="display__name" id="station-name">— NO SIGNAL —</div>
      <div class="display__meta" id="display-meta"></div>
    </div>
    <div class="display__visualizer" id="visualizer" aria-hidden="true"></div>
  </section>

  <section class="transport">
    <button class="btn btn--transport" id="btn-prev" type="button" aria-label="Previous station">
      <span class="btn__icon" aria-hidden="true">&#x23EE;</span>
    </button>
    <button class="btn btn--transport btn--play" id="btn-play" type="button" aria-label="Play">
      <span class="btn__icon" aria-hidden="true">&#x23EF;&#xFE0E;</span>
    </button>
    <button class="btn btn--transport" id="btn-next" type="button" aria-label="Next station">
      <span class="btn__icon" aria-hidden="true">&#x23ED;&#xFE0E;</span>
    </button>
  </section>



  <section class="theme-toggle" aria-label="Display mode">
    <button class="btn btn--theme" data-theme-choice="light" type="button" aria-label="Light mode">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/>
      </svg>
    </button>
    <button class="btn btn--theme" data-theme-choice="dark" type="button" aria-label="Dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="currentColor"/></svg>
    </button>
    <button class="btn btn--theme" data-theme-choice="system" type="button" aria-label="System mode">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor"/>
      </svg>
    </button>
  </section>

</main>

<audio id="audio" preload="none"></audio>

<script src="app.js"></script>
</body>
</html>
